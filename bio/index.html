<!-- Link da bio do Instagram. Responde 200 e manda para a pagina real ja etiquetada,
     para a visita entrar no painel como Instagram e nao como trafego direto.
     Aceita ?c=nome para separar a campanha (ex: link de story). -->
<script>
var c = new URLSearchParams(location.search).get("c") || "perfil";
c = encodeURIComponent(String(c).slice(0, 40));
location.replace("/?utm_source=instagram&utm_medium=bio&utm_campaign=" + c);
</script>
<meta http-equiv="refresh" content="0; url=/?utm_source=instagram&utm_medium=bio&utm_campaign=perfil">
</head>
<body style="margin:0;background:#FBF6F4;color:#5A463F;font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif">

</body>
</html>
